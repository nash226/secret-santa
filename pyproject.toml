[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-santa"
version = "1.0.0"
description = "A constraint-aware Secret Santa assignment service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nazeer Shaikh" }]
dependencies = []

[project.scripts]
secret-santa = "secret_santa.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"secret_santa.web_assets" = ["*.html", "*.css", "*.js", "*.jpg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
